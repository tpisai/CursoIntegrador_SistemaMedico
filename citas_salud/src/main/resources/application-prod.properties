# Perfil de producción. Lo activa la imagen de Docker (SPRING_PROFILES_ACTIVE=prod) y solo cambia lo
# que difiere de application.properties. Las variables sin valor por defecto son obligatorias a
# propósito: si falta alguna, el backend no arranca. Los valores van en el archivo .env de la raíz.

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.thymeleaf.cache=true

# TokenService además rechaza en este perfil la clave de desarrollo y las de menos de 32 caracteres.
saludgrau.token.secreto=${SALUDGRAU_TOKEN_SECRETO}

# El servidor SMTP se define con SPRING_MAIL_HOST, SPRING_MAIL_PORT, SPRING_MAIL_USERNAME y
# SPRING_MAIL_PASSWORD. Sin SPRING_MAIL_HOST los correos solo se registran en el log.
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
# Sin estos límites, un puerto SMTP bloqueado por el proveedor deja el envío esperando sin fin.
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
